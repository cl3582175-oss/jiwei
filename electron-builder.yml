appId: io.github.cl3582175-oss.jiwei
productName: 积微
artifactName: Jiwei-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 青风铃
beforePack: scripts/mac-before-pack.cjs
afterPack: scripts/mac-after-pack.cjs
afterSign: scripts/mac-after-sign.cjs
directories:
  buildResources: build
  output: release/${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!.superpowers/**'
  - '!e2e/**'
  - '!test-results/**'
  - '!scripts/**'
  - '!playwright-report/**'
  # 本地打包产物与测试数据：不能打进应用（否则每次本地打包都会把旧版本装进去，体积越来越大）
  - '!release/**'
  - '!out/test-*/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!drizzle.config.ts'
  - '!drizzle.profile.config.ts'
  - '!{.gitignore,.editorconfig,.prettierrc,README*.md,CHANGELOG.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/sqlite-vec*/**
extraResources:
  - from: resources/migrations
    to: migrations
  - from: resources/profile-migrations
    to: profile-migrations
  - from: resources/wordfreq
    to: wordfreq
  - from: resources/zipvoice
    to: zipvoice
protocols:
  - name: Jiwei
    schemes: [jiwei]
mac:
  category: public.app-category.education
  identity: '-'
  hardenedRuntime: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  strictVerify: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  background: build/dmg-background.png
  window:
    width: 680
    height: 480
  iconSize: 96
  contents:
    - x: 160
      y: 220
    - x: 520
      y: 220
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 积微
  include: build/installer.nsh
linux:
  category: Education
  target: [AppImage, deb]
  maintainer: 青风铃
publish:
  provider: github
  owner: cl3582175-oss
  repo: jiwei-releases
  releaseType: draft
