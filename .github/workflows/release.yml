name: Release

# 在三个平台构建安装包并上传到 GitHub Releases。
# 快速迭代阶段：推送标签不再自动打包（节省 Actions 额度），需要发安装包时在 Actions 页面手动运行，选择要发布的标签。
# 稳定后恢复为：push 标签 v* 时自动运行。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v0.6.1）'
        required: true

# 上传到 GitHub Releases 需要写权限（默认的 GITHUB_TOKEN 只读）
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
