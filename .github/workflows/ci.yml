name: CI

# 快速迭代阶段：不自动运行（节省 Actions 额度），需要时在 GitHub 的 Actions 页面手动运行。
# 稳定后恢复为：push 到 main、pull_request 时自动运行。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:e2e
